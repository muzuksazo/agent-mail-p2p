[package]
name = "agent-mail-p2p"
version = "0.2.0"
edition = "2021"
description = "5-Layer Local-First P2P Multi-Agent Collaboration & Hybrid MCP Bus (Iroh QUIC + Gossip + Range Sync + Loro CRDT + HLC Lease + SQLite WAL)"
license = "MIT OR Apache-2.0"

[dependencies]
# Layer 1 & 2: QUIC NAT Traversal (QNT), Plumtree/HyParView Gossip & Binary Wire Codec
iroh = "1.2"
iroh-gossip = "0.102.0"
futures-lite = "2.5"
postcard = { version = "1.1", features = ["use-std"] }
data-encoding = "2.6"

# Layer 3: Replayable Event Graph CRDT & Meadowcap-style Ed25519 Capability Cryptography
loro = "1.17.1"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
blake3 = "1.8"
rand = "0.8"

# Layer 4: Bundled Zero-System-Dep SQLite WAL + FTS5 Local Read Projection
rusqlite = { version = "0.32", features = ["bundled"] }

# Layer 5: Local Axum SSE Group-Chat UI + Async Runtime + Single-Binary CLI
axum = "0.8"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob-match = "0.2"
