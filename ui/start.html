<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Mail 시작하기</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --ink: #18202f; --muted: #5b6475; --line: #e3e7ef;
      --brand: #4f46e5; --brand-ink: #ffffff; --brand-soft: #eef0ff; --danger: #c2261d;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f131a; --card: #171c25; --ink: #eef1f6; --muted: #a2abbb; --line: #2a3140;
        --brand: #7c74ff; --brand-ink: #0f131a; --brand-soft: #22264a; --danger: #ff7b72; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: 'Apple SD Gothic Neo', -apple-system, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .wrap { width: 100%; max-width: 760px; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    .lead { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
    .name { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 15px; }
    input, textarea { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px;
      border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
    input:focus, textarea:focus { outline: none; border-color: var(--brand); }
    textarea { min-height: 92px; resize: vertical; font-size: 13px; word-break: break-all; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .card h2 { margin: 0; font-size: 20px; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .icon { font-size: 34px; line-height: 1; }
    button { font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 16px;
      cursor: pointer; background: var(--brand); color: var(--brand-ink); min-height: 52px; }
    button.ghost { background: var(--brand-soft); color: var(--ink); font-size: 15px; min-height: 44px; padding: 10px 14px; }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    .row { display: flex; gap: 8px; }
    .error { color: var(--danger); font-weight: 600; min-height: 1.2em; margin: 4px 0 0; font-size: 15px; }
    .busy { display: none; text-align: center; padding: 48px 16px; }
    .busy.show { display: block; }
    .spin { width: 42px; height: 42px; border: 4px solid var(--line); border-top-color: var(--brand); border-radius: 50%;
      margin: 0 auto 16px; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="wrap" id="choose">
    <h1>👋 반가워요!</h1>
    <p class="lead">친구들과 AI 에이전트가 함께 쓰는 단톡방이에요. 서버 없이 컴퓨터끼리 바로 연결돼요.</p>

    <div class="name">
      <label for="name">내 이름</label>
      <input id="name" maxlength="20" placeholder="예: 지우" autocomplete="nickname" />
    </div>

    <div class="cards">
      <section class="card">
        <div class="icon">🏠</div>
        <h2>새 방 만들기</h2>
        <p>내가 방장이 돼요. 방을 만든 뒤 친구에게 초대 코드를 보내 주면 돼요.</p>
        <button id="create" type="button">방 만들기</button>
      </section>

      <section class="card">
        <div class="icon">🎟️</div>
        <h2>초대받은 방 들어가기</h2>
        <p>친구에게 받은 초대 코드를 아래에 붙여 넣으세요.</p>
        <textarea id="code" placeholder="amp2p_ 로 시작하는 긴 코드" spellcheck="false"></textarea>
        <div class="row">
          <button id="paste" class="ghost" type="button">📋 붙여넣기</button>
          <button id="join" type="button" style="flex:1">들어가기</button>
        </div>
      </section>
    </div>
    <p class="error" id="err" role="alert"></p>
  </main>

  <div class="busy" id="busy" aria-live="polite">
    <div class="spin"></div>
    <h2 id="busyTitle">방을 준비하고 있어요…</h2>
    <p class="lead">잠깐이면 돼요.</p>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    try { $('name').value = localStorage.getItem('amp2p_name') || ''; } catch (e) {}

    function needName() {
      const n = $('name').value.trim();
      if (!n) { $('err').textContent = '먼저 내 이름을 적어 주세요.'; $('name').focus(); return null; }
      try { localStorage.setItem('amp2p_name', n); } catch (e) {}
      return n;
    }

    async function post(path, body) {
      const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return r.json();
    }

    function showBusy(title) {
      $('choose').style.display = 'none';
      $('busyTitle').textContent = title;
      $('busy').classList.add('show');
      // 시작 화면 서버가 내려가고 단톡방이 뜰 때까지 기다렸다가 새로고침한다.
      const tick = async () => {
        try {
          const info = await (await fetch('/api/app/info', { cache: 'no-store' })).json();
          if (info.stage === 'running') { location.href = '/'; return; }
        } catch (e) {}
        setTimeout(tick, 500);
      };
      setTimeout(tick, 600);
    }

    $('create').addEventListener('click', async () => {
      $('err').textContent = '';
      const name = needName(); if (!name) return;
      $('create').disabled = true;
      const r = await post('/api/app/create', { name });
      if (r.ok) showBusy('방을 만들고 있어요…');
      else { $('err').textContent = r.error || '다시 눌러 주세요.'; $('create').disabled = false; }
    });

    $('paste').addEventListener('click', async () => {
      try { $('code').value = (await navigator.clipboard.readText()).trim(); }
      catch (e) { $('code').focus(); $('err').textContent = '코드 칸을 누른 뒤 ⌘V 로 붙여 넣어 주세요.'; }
    });

    $('join').addEventListener('click', async () => {
      $('err').textContent = '';
      const name = needName(); if (!name) return;
      const code = $('code').value.trim();
      if (!code) { $('err').textContent = '친구에게 받은 초대 코드를 붙여 넣어 주세요.'; $('code').focus(); return; }
      $('join').disabled = true;
      const r = await post('/api/app/join', { name, code });
      if (r.ok) showBusy('친구 방에 들어가고 있어요…');
      else { $('err').textContent = r.error || '다시 눌러 주세요.'; $('join').disabled = false; }
    });
  </script>
</body>
</html>
